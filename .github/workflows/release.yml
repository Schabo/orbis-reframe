# Builds a release (docs/RELEASE.md) when its tag is pushed: per target
# (scripts/targets.sh) scripts/package.sh in a clean container of that
# release -- the same script as by hand -- then the .deb installed in a fresh
# one; the AppImage (scripts/package.sh --target appimage) and its check in
# bare Debian 13 and Ubuntu 26.04; then a *draft* GitHub release with the
# files, their build provenance and the version's CHANGELOG.md section. Publishing stays by hand, after the
# GPU test of the draft's packages (scripts/release_test.sh).
#
# By hand (workflow_dispatch) it's a dry run: build and check the packages of
# the chosen branch, keep them as workflow artifacts, make no release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        include:
          - target: debian-testing
            image: docker.io/library/debian:testing
          - target: debian-13
            image: docker.io/library/debian:trixie
          - target: ubuntu-26.04
            image: docker.io/library/ubuntu:26.04
    container: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # As scripts/package.sh installs them for a container build, plus
      # what scripts/fetch_ncnn.sh needs.
      - name: Install build dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
              g++ cmake ninja-build pkgconf \
              qt6-base-dev qt6-base-dev-tools qt6-wayland qt6-svg-plugins \
              libvulkan-dev glslang-tools nlohmann-json3-dev zlib1g-dev \
              libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev libavfilter-dev \
              libopencv-dev libopencv-contrib-dev libonnxruntime-dev \
              git dpkg-dev file desktop-file-utils shared-mime-info xz-utils ca-certificates curl unzip > /dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git describe needs the tags for the version
      # The container runs as root over a checkout owned by the runner's user.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # cz bump wrote the tag's version into both files; a tag pushed by hand
      # on another commit would build a version that doesn't match it.
      - name: The tag is the version
        if: github.ref_type == 'tag'
        run: |
          v=${GITHUB_REF_NAME#v}
          grep -qx "version = \"$v\"" .cz.toml || { echo ".cz.toml isn't at $v" >&2; exit 1; }
          sed -nE 's/^project\(orbis-reframe VERSION ([0-9.]+).*/\1/p' CMakeLists.txt | grep -qx "$v" \
              || { echo "CMakeLists.txt's project() isn't at $v" >&2; exit 1; }
      - name: Fetch ncnn
        run: scripts/fetch_ncnn.sh
      # The container's own release is the target (scripts/targets.sh).
      - name: Build the packages
        run: scripts/package.sh
      - name: The packages carry the tag's version
        if: github.ref_type == 'tag'
        run: |
          v=${GITHUB_REF_NAME#v}
          test -f "dist/${{ matrix.target }}/orbis-reframe-$v-source.tar.xz" \
              || { ls dist/${{ matrix.target }}; echo "built a version other than $v" >&2; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14

  # Not in a container: scripts/package.sh builds the AppImage's runtime
  # with podman and the machine's /dev/fuse, then everything else in its own
  # debian:trixie container -- as by hand, so the bundle is built against
  # Debian 13's glibc, not this machine's.
  package-appimage:
    name: Package (appimage)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git describe needs the tags for the version
      - name: The tag is the version
        if: github.ref_type == 'tag'
        run: |
          v=${GITHUB_REF_NAME#v}
          grep -qx "version = \"$v\"" .cz.toml || { echo ".cz.toml isn't at $v" >&2; exit 1; }
          sed -nE 's/^project\(orbis-reframe VERSION ([0-9.]+).*/\1/p' CMakeLists.txt | grep -qx "$v" \
              || { echo "CMakeLists.txt's project() isn't at $v" >&2; exit 1; }
      # Our FFmpeg and the runtime, each reused by its script when its
      # configuration is unchanged (the runtime's hash is checked on reuse).
      - name: Cache FFmpeg and the runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party/ffmpeg
            third_party/appimage-runtime
          key: appimage-${{ hashFiles('scripts/build_ffmpeg.sh', 'scripts/build_appimage_runtime.sh') }}
      - name: Fetch ncnn
        run: scripts/fetch_ncnn.sh
      - name: Build the AppImage
        run: scripts/package.sh --target appimage
      - name: The AppImage carries the tag's version
        if: github.ref_type == 'tag'
        run: |
          v=${GITHUB_REF_NAME#v}
          test -f "dist/appimage/orbis-reframe-$v-x86_64.AppImage" \
              || { ls dist/appimage; echo "built a version other than $v" >&2; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-appimage
          path: dist/appimage/
          if-no-files-found: error
          retention-days: 14

  # The AppImage in bare images with only the libraries it takes from the
  # system (no glvnd's libOpenGL / libGLX: the bundled fallback is used):
  # every bundled library resolves, --version is right.
  install-appimage:
    name: Install (appimage, ${{ matrix.image }})
    needs: package-appimage
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ["docker.io/library/debian:trixie", "docker.io/library/ubuntu:26.04"]
    container: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-appimage
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum -c ./*.sha256
      - name: The system's part
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends libegl1 libx11-6 libdrm2 libfontconfig1 \
              libfreetype6 libharfbuzz0b libvulkan1 libwayland-client0 > /dev/null
      - name: Check it
        working-directory: dist
        run: |
          app=$(ls orbis-reframe-*-x86_64.AppImage)
          chmod +x "$app"
          "./$app" --appimage-extract > /dev/null
          fallback=$(ls -d "$PWD"/squashfs-root/usr/lib/glvnd-fallback/* | tr '\n' :)
          missing=$(find squashfs-root/usr -type f \( -name '*.so*' -o -path '*/bin/*' \) ! -path '*/glvnd-fallback/*' \
              -exec sh -c '[ "$(head -c 4 "$1" | tail -c 3)" = ELF ] || exit 0
                  LD_LIBRARY_PATH=$2 ldd "$1" | grep "not found" | sed "s|^|$1: |"' _ {} "$fallback" \;)
          [ -z "$missing" ] || { echo "libraries not found:"; echo "$missing"; exit 1; } >&2
          # No FUSE in a container.
          reported=$(APPIMAGE_EXTRACT_AND_RUN=1 "./$app" --version)
          v=${app#orbis-reframe-}
          v=${v%-x86_64.AppImage}
          echo "$reported"
          [ "$reported" = "orbis-reframe $v" ] || { echo "expected orbis-reframe $v" >&2; exit 1; }

  # The .deb in a fresh container of its release: apt finds every dependency,
  # every library resolves, --version is right.
  install:
    name: Install (${{ matrix.target }})
    needs: package
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: debian-testing
            image: docker.io/library/debian:testing
          - target: debian-13
            image: docker.io/library/debian:trixie
          - target: ubuntu-26.04
            image: docker.io/library/ubuntu:26.04
    container: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum -c ./*.sha256
      - name: Install the .deb
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ./dist/orbis-reframe_*_amd64.deb > /dev/null
      - name: Check it
        run: |
          missing=$(ldd /usr/bin/orbis-reframe | grep "not found" || true)
          [ -z "$missing" ] || { echo "libraries not found:"; echo "$missing"; exit 1; } >&2
          reported=$(orbis-reframe --version)
          v=$(ls dist/orbis-reframe-*-source.tar.xz | sed -E 's|.*/orbis-reframe-(.*)-source\.tar\.xz|\1|')
          echo "$reported"
          [ "$reported" = "orbis-reframe $v" ] || { echo "expected orbis-reframe $v" >&2; exit 1; }

  release:
    name: Draft release
    needs: [install, install-appimage]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release
      id-token: write # the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
      # Every target's folder holds the same source archive: take one.
      - name: Collect the files
        run: |
          mkdir release
          cp dist/dist-debian-testing/* release/
          cp dist/dist-debian-13/*.deb13_* dist/dist-debian-13/*-debian-13-* release/
          cp dist/dist-ubuntu-26.04/*.ubuntu26.04_* dist/dist-ubuntu-26.04/*-ubuntu-26.04-* release/
          # The AppImage, its .zsync, sources list and the sources it hosts.
          cp dist/dist-appimage/* release/
          ls -l release
          [ "$(ls release | wc -l)" -eq 24 ] || { echo "expected 24 files" >&2; exit 1; }
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.tar.xz
            release/*.deb
            release/*.AppImage
      # The version's section of CHANGELOG.md (cz bump wrote it).
      - name: Release notes
        run: |
          awk -v h="## $GITHUB_REF_NAME " 'index($0, h) == 1 { on = 1; next } /^## / { on = 0 } on' \
              CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "no '## $GITHUB_REF_NAME' section in CHANGELOG.md" >&2; exit 1; }
          cat notes.md
      - name: Make the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "orbis-reframe ${GITHUB_REF_NAME#v}" --notes-file notes.md release/*
