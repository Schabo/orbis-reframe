# The GPU checks GitHub's runners can't do: build, ctest and the headless GPU
# tools on a real clip, on the maintainer's self-hosted runner (label `gpu`:
# an NVIDIA GPU, the test footage read-only at /footage). On pushes to main,
# on pull requests, and by hand; not for changes to the docs or the site.
#
# The runner is a private machine, so a pull request's code runs there only
# after two approvals: the repository's approval of outside contributors'
# runs (Settings > Actions), and, for pull requests from forks, the
# `gpu-runner` environment's required reviewer (the `approve` job below).
# Never switch this to pull_request_target, and don't drop the gate.
name: GPU

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "site/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "site/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch / pull request: a newer push replaces the one waiting.
concurrency:
  group: gpu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pull requests from forks wait here, on GitHub's runners, for the
  # maintainer to approve running them on the GPU machine.
  approve:
    name: Approve the GPU run
    if: github.event.pull_request.head.repo.fork == true
    runs-on: ubuntu-latest
    environment: gpu-runner
    steps:
      - run: echo "Approved to run on the GPU runner"

  gpu:
    name: Build + GPU tools
    needs: approve
    # The gate passed, or wasn't needed (not a fork).
    if: >-
      always() &&
      (needs.approve.result == 'success' ||
       (needs.approve.result == 'skipped' && github.event.pull_request.head.repo.fork != true))
    runs-on: [self-hosted, gpu]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git describe needs the tags for the version
      - name: GPU
        run: |
          nvidia-smi --query-gpu=name,driver_version --format=csv,noheader
          vulkaninfo --summary 2>&1 | grep -E 'deviceName|driverInfo' | head -2
      - name: Fetch ncnn
        run: scripts/fetch_ncnn.sh
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DORBIS_REQUIRE_ALL_FEATURES=ON
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure
      - name: GPU tools on the test clip
        run: tests/release/gpu_tools.sh build gpu-results
      # Logs only: the tools' pictures and video are of private footage, and
      # this repository's artifacts are public.
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gpu-logs
          path: |
            gpu-results/*.log
            gpu-results/results.txt
          if-no-files-found: ignore
          retention-days: 14
