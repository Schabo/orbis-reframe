# Builds and tests every push to main and every pull request on GitHub's
# runners (free for a public repository), in a clean container of each
# release target (scripts/targets.sh) -- the same build dependencies and
# every feature on, as scripts/package.sh. No GPU here: ctest runs offscreen,
# and the GPU checks stay with scripts/release_test.sh.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build + test (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: debian-testing
            image: docker.io/library/debian:testing
          - target: debian-13
            image: docker.io/library/debian:trixie
          - target: ubuntu-26.04
            image: docker.io/library/ubuntu:26.04
    container: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # docs/dev-environment.md's build dependencies, all of them
      # (ORBIS_REQUIRE_ALL_FEATURES), plus git for the version and what
      # scripts/fetch_ncnn.sh needs.
      - name: Install build dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
              g++ cmake ninja-build pkgconf \
              qt6-base-dev qt6-base-dev-tools qt6-multimedia-dev qt6-wayland qt6-svg-plugins \
              libvulkan-dev glslang-tools nlohmann-json3-dev \
              libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev libavfilter-dev \
              libopencv-dev libopencv-contrib-dev libonnxruntime-dev \
              git curl unzip ca-certificates xz-utils > /dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git describe needs the tags for the version
      # The container runs as root over a checkout owned by the runner's user.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Fetch ncnn
        run: scripts/fetch_ncnn.sh
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DORBIS_REQUIRE_ALL_FEATURES=ON
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

  # Conventional Commits (CONTRIBUTING.md): what the commit-msg hook checks,
  # for the commits a push or pull request adds.
  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    container: docker.io/library/debian:testing
    steps:
      - name: Install commitizen
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends commitizen git ca-certificates > /dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: cz check
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # A new branch or a manual run has no "before": check just HEAD.
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
              BASE="$HEAD~1"
          fi
          cz check --rev-range "$BASE..$HEAD"
